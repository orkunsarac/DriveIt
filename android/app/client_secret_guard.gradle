import groovy.json.JsonSlurper
import java.util.Base64

// Dart defines are client-visible. Never print their values in diagnostics.
def rawDefines = providers.gradleProperty('dart-defines').orNull
if (rawDefines != null && !rawDefines.isEmpty()) {
    rawDefines.split(',').each { encoded ->
        String entry
        try {
            entry = new String(Base64.decoder.decode(encoded), 'UTF-8')
        } catch (Exception ignored) {
            throw new GradleException('Client configuration contains an invalid encoded define.')
        }
        int separator = entry.indexOf('=')
        if (separator < 1) throw new GradleException('Client configuration contains an invalid define.')
        def name = entry.substring(0, separator).toUpperCase(Locale.ROOT)
        def value = entry.substring(separator + 1)
        if (name.contains('SERVICE_ROLE') || name.contains('SECRET_KEY') || value.contains('sb_secret_')) {
            throw new GradleException('Secret or service-role values are forbidden in client configuration.')
        }
        def parts = value.split('\\.', -1)
        if (parts.length == 3) {
            try {
                def body = new String(Base64.urlDecoder.decode(parts[1]), 'UTF-8')
                def payload = new JsonSlurper().parseText(body)
                if (payload instanceof Map && payload.role == 'service_role') {
                    throw new GradleException('Secret or service-role values are forbidden in client configuration.')
                }
            } catch (GradleException error) {
                throw error
            } catch (Exception ignored) {
                // Non-JWT values are evaluated by their respective feature guards.
            }
        }
    }
}
